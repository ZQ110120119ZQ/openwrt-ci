      - name: Configure Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "LOCATE LINUX 6.12.106"
          echo "=========================================="

          KDIR="$(find build_dir/target-* \
            -maxdepth 4 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: linux-6.12.106 directory not found"
            exit 1
          fi

          echo "KDIR=$KDIR"

          cd "$KDIR"

          echo
          echo "=========================================="
          echo "CREATE KERNEL CONFIG"
          echo "=========================================="

          if [ -f .config ]; then
            echo "Existing .config found"
          else
            echo "No .config yet"
          fi

          echo
          echo "=========================================="
          echo "FORCE REQUIRED NETFILTER OPTIONS"
          echo "=========================================="

          # nftables core
          ./scripts/config --enable NF_TABLES

          # Xtables / iptables compatibility
          ./scripts/config --module NETFILTER_XTABLES
          ./scripts/config --enable NETFILTER_XTABLES_COMPAT

          # nftables xtables compatibility layer
          ./scripts/config --module NF_TABLES_COMPAT

          echo
          echo "=========================================="
          echo "RUN OLDDEFCONFIG"
          echo "=========================================="

          make olddefconfig

          echo
          echo "=========================================="
          echo "FINAL NETFILTER CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
            .config || true

          echo
          echo "=========================================="
          echo "VERIFY REQUIRED CONFIG"
          echo "=========================================="

          grep -q '^CONFIG_NF_TABLES=y$' .config
          grep -q '^CONFIG_NETFILTER_XTABLES=m$' .config
          grep -q '^CONFIG_NETFILTER_XTABLES_COMPAT=y$' .config
          grep -q '^CONFIG_NF_TABLES_COMPAT=m$' .config

          echo
          echo "=========================================="
          echo "CONFIGURATION OK"
          echo "=========================================="