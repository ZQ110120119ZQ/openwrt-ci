name: Build kmod-nft-compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # FREE DISK SPACE
      # ============================================================
      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean

          df -h

      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils \
            bc \
            kmod \
            pkg-config \
            libdw-dev

      # ============================================================
      # CLONE EXACT IMMORTALWRT SOURCE
      # ============================================================
      - name: Clone exact ImmortalWrt source
        run: |
          set -eux

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(
            curl -fsSL \
              https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])'
          )"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline

      # ============================================================
      # CONFIGURE TARGET
      # ============================================================
      - name: Configure target
        run: |
          set -eux

          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y

          CONFIG_PACKAGE_kmod-nft-compat=m
          CONFIG_PACKAGE_iptables-nft=y
          EOF

          make defconfig

          echo
          echo "=========================================="
          echo "RESOLVED PACKAGE CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-nft-compat|iptables-nft)=' \
            .config || true

      # ============================================================
      # PREPARE LINUX 6.12.106
      # ============================================================
      - name: Prepare Linux 6.12.106
        run: |
          set -eux

          cd wrt

          make target/linux/prepare V=s

          KDIR="$(
            find build_dir/target-* \
              -maxdepth 5 \
              -type d \
              -name 'linux-6.12.106' \
              -print -quit
          )"

          if [ -z "$KDIR" ]; then
            echo "ERROR: Linux 6.12.106 source directory not found"

            find build_dir/target-* \
              -maxdepth 5 \
              -type d \
              -name 'linux-*' \
              -print || true

            exit 1
          fi

          echo "$KDIR" > /tmp/kdir

          echo
          echo "KERNEL DIRECTORY:"
          echo "$KDIR"

          VERSION="$(
            make -s -C "$KDIR" kernelversion 2>/dev/null \
              | tr -d '\r\n'
          )"

          echo
          echo "KERNEL VERSION:"
          echo "$VERSION"

          if [ "$VERSION" != "6.12.106" ]; then
            echo "ERROR: Expected 6.12.106"
            echo "       Got: $VERSION"
            exit 1
          fi

          echo
          echo "SUCCESS: Linux 6.12.106 confirmed."

      # ============================================================
      # RESOLVE KERNEL CONFIG
      # ============================================================
      - name: Resolve kernel configuration
        run: |
          set -eux

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "KERNEL CONFIG BEFORE PACKAGE BUILD"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_XTABLES|NF_TABLES|NFT_COMPAT)=' \
            "$KDIR/.config" || true

          echo
          echo "=========================================="
          echo "KERNEL PACKAGE DEFINITION"
          echo "=========================================="

          grep -n -A35 -B5 \
            'KernelPackage/nft-compat' \
            package/kernel/linux/modules/netfilter.mk || true

      # ============================================================
      # BUILD HOST TOOLS
      # ============================================================
      - name: Build host tools
        run: |
          set -eux

          cd wrt

          make tools/install -j"$(nproc)"

      # ============================================================
      # BUILD TOOLCHAIN
      # ============================================================
      - name: Build toolchain
        run: |
          set -eux

          cd wrt

          make toolchain/install -j"$(nproc)"

      # ============================================================
      # BUILD KERNEL PACKAGES
      # ============================================================
      - name: Build Linux kernel packages
        run: |
          set -eux

          cd wrt

          echo "=========================================="
          echo "BUILD KERNEL PACKAGES"
          echo "=========================================="

          make package/kernel/linux/compile V=s -j"$(nproc)"

      # ============================================================
      # LOCATE kmod-nft-compat APK
      # ============================================================
      - name: Locate kmod-nft-compat APK
        run: |
          set -eux

          cd wrt

          echo "=========================================="
          echo "SEARCH kmod-nft-compat APK"
          echo "=========================================="

          find bin \
            -type f \
            -name 'kmod-nft-compat*.apk' \
            -print | sort

          APK="$(
            find bin \
              -type f \
              -name 'kmod-nft-compat*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: kmod-nft-compat APK was not generated."

            echo
            echo "ALL KERNEL APK:"
            find bin \
              -type f \
              -name 'kmod-*.apk' \
              -print | sort || true

            exit 1
          fi

          echo
          echo "FOUND:"
          echo "$APK"

          echo "$APK" > /tmp/nft_apk

      # ============================================================
      # VERIFY APK CONTENT
      # ============================================================
      - name: Verify APK content
        run: |
          set -eux

          cd wrt

          APK="$(cat /tmp/nft_apk)"

          echo "=========================================="
          echo "APK FILE"
          echo "=========================================="

          file "$APK"
          ls -lh "$APK"

          echo
          echo "=========================================="
          echo "APK SHA256"
          echo "=========================================="

          sha256sum "$APK"

          echo
          echo "=========================================="
          echo "APK CONTENT"
          echo "=========================================="

          tar -tf "$APK" | grep -E \
            '(^|/)nft_compat\.ko$|(^|/)modules/.*/nft_compat\.ko$' \
            || true

          if ! tar -tf "$APK" | grep -Eq \
            '(^|/)nft_compat\.ko$|(^|/)modules/.*/nft_compat\.ko$'
          then
            echo
            echo "ERROR: nft_compat.ko is NOT inside kmod-nft-compat APK"
            exit 1
          fi

          echo
          echo "SUCCESS: nft_compat.ko exists inside APK."

      # ============================================================
      # EXTRACT AND VERIFY MODULE
      # ============================================================
      - name: Verify nft_compat kernel module
        run: |
          set -eux

          cd wrt

          APK="$(cat /tmp/nft_apk)"

          rm -rf /tmp/nft-check
          mkdir -p /tmp/nft-check

          tar -xf "$APK" -C /tmp/nft-check

          NFT_KO="$(
            find /tmp/nft-check \
              -type f \
              -name 'nft_compat.ko' \
              -print -quit
          )"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko extraction failed"
            exit 1
          fi

          echo "=========================================="
          echo "NFT COMPAT MODULE"
          echo "=========================================="

          echo "$NFT_KO"

          echo
          echo "FILE:"
          file "$NFT_KO"

          echo
          echo "MODINFO:"
          modinfo "$NFT_KO" || true

          echo
          echo "VERMAGIC:"
          modinfo -F vermagic "$NFT_KO" || true

          VERMAGIC="$(
            modinfo -F vermagic "$NFT_KO" 2>/dev/null || true
          )"

          case "$VERMAGIC" in
            6.12.106*)
              echo
              echo "SUCCESS: vermagic starts with 6.12.106"
              ;;
            *)
              echo
              echo "ERROR: vermagic mismatch"
              echo "Expected: 6.12.106*"
              echo "Actual:   $VERMAGIC"
              exit 1
              ;;
          esac

      # ============================================================
      # VERIFY KERNEL RELEASE
      # ============================================================
      - name: Verify kernel release
        run: |
          set -eux

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "KERNEL RELEASE"
          echo "=========================================="

          make -s -C "$KDIR" kernelrelease

          RELEASE="$(
            make -s -C "$KDIR" kernelrelease \
              | tr -d '\r\n'
          )"

          echo
          echo "RELEASE:"
          echo "$RELEASE"

          case "$RELEASE" in
            6.12.106*)
              echo
              echo "SUCCESS: kernel release matches 6.12.106"
              ;;
            *)
              echo
              echo "ERROR: kernel release mismatch"
              exit 1
              ;;
          esac

      # ============================================================
      # COLLECT RESULT
      # ============================================================
      - name: Collect result
        run: |
          set -eux

          cd wrt

          mkdir -p result

          APK="$(cat /tmp/nft_apk)"

          cp "$APK" result/

          echo "=========================================="
          echo "RESULT"
          echo "=========================================="

          ls -lh result/

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum result/*

          echo
          echo "SUCCESS: kmod-nft-compat package collected."

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-nft-compat-6.12.106-qualcommax-ipq60xx
          path: wrt/result/*
          if-no-files-found: error
          retention-days: 30