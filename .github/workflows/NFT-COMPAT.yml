name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # FREE DISK SPACE
      # ==========================================================

      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          sudo apt-get clean

          echo "=========================================="
          echo "DISK SPACE"
          echo "=========================================="

          df -h


      # ==========================================================
      # BUILD DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils \
            bc \
            kmod


      # ==========================================================
      # CLONE EXACT IMMORTALWRT
      # ==========================================================

      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline


      # ==========================================================
      # OPENWRT TARGET CONFIG
      # ==========================================================

      - name: Configure OpenWrt target
        run: |
          set -e

          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          echo "=========================================="
          echo "OPENWRT DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "TARGET CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_TARGET_qualcommax|CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02|CONFIG_PACKAGE_kmod-nft-compat' \
            .config || true


      # ==========================================================
      # HOST TOOLS
      # ==========================================================

      - name: Build host tools
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="

          make tools/install -j2 V=s


      # ==========================================================
      # TOOLCHAIN
      # ==========================================================

      - name: Build toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="

          make toolchain/install -j2 V=s


      # ==========================================================
      # VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify OpenWrt toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "LOCATE AARCH64 GCC"
          echo "=========================================="

          TOOLCHAIN_DIR="$(find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print \
            -quit)"

          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: OpenWrt toolchain directory not found"
            find staging_dir -maxdepth 2 -type d -print || true
            exit 1
          fi

          GCC_DIR="$TOOLCHAIN_DIR/bin"

          GCC="$GCC_DIR/aarch64-openwrt-linux-musl-gcc"

          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          echo "GCC_DIR=$GCC_DIR"
          echo "GCC=$GCC"

          if [ ! -x "$GCC" ]; then
            echo "ERROR: GCC not found:"
            echo "$GCC"
            echo
            echo "Toolchain bin directory:"
            ls -lah "$GCC_DIR" || true
            exit 1
          fi

          echo
          echo "GCC VERSION:"
          "$GCC" --version | head -1

          echo
          echo "=========================================="
          echo "EXPORT TOOLCHAIN PATH"
          echo "=========================================="

          echo "$PWD/$GCC_DIR" >> "$GITHUB_PATH"

          echo
          echo "PATH WILL CONTAIN:"
          echo "$PWD/$GCC_DIR"


      # ==========================================================
      # PREPARE LINUX
      # ==========================================================

      - name: Prepare Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "PREPARE LINUX 6.12.106"
          echo "=========================================="

          make target/linux/prepare V=s


      # ==========================================================
      # CONFIGURE LINUX
      # ==========================================================

      - name: Configure Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "LOCATE LINUX 6.12.106"
          echo "=========================================="

          KDIR="$(find build_dir/target-* \
            -maxdepth 4 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: linux-6.12.106 directory not found"
            exit 1
          fi

          echo "KDIR=$KDIR"

          cd "$KDIR"


          # ------------------------------------------------------
          # TOOLCHAIN CHECK
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CHECK TOOLCHAIN"
          echo "=========================================="

          command -v aarch64-openwrt-linux-musl-gcc
          aarch64-openwrt-linux-musl-gcc --version | head -1


          # ------------------------------------------------------
          # CHECK KERNEL SOURCE
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CHECK KERNEL SOURCE"
          echo "=========================================="

          if [ ! -f net/netfilter/nft_compat.c ]; then
            echo "ERROR: net/netfilter/nft_compat.c not found"
            exit 1
          fi

          echo "nft_compat.c FOUND"


          # ------------------------------------------------------
          # CHECK REAL KCONFIG SYMBOLS
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CHECK REAL KCONFIG SYMBOLS"
          echo "=========================================="

          grep -R \
            -E '^[[:space:]]*config (NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)' \
            net/netfilter \
            net \
            2>/dev/null | head -100 || true


          # ------------------------------------------------------
          # KERNEL CONFIG TOOL
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CHECK scripts/config"
          echo "=========================================="

          if [ ! -x scripts/config ]; then
            echo "ERROR: scripts/config not found"
            exit 1
          fi

          echo "scripts/config OK"


          # ------------------------------------------------------
          # CREATE BASE KERNEL CONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CREATE BASE KERNEL CONFIG"
          echo "=========================================="

          if [ ! -f .config ]; then
            echo "No kernel .config found"
            echo "Running OpenWrt kernel configuration first"

            cd ../../../..

            make target/linux/compile V=s \
              CONFIG_PACKAGE_kmod-nft-compat=m \
              || true

            cd "$KDIR"
          fi


          # ------------------------------------------------------
          # SHOW CONFIG BEFORE CHANGE
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CONFIG BEFORE CHANGE"
          echo "=========================================="

          if [ -f .config ]; then
            grep -E \
              '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
              .config || true
          else
            echo "ERROR: kernel .config still does not exist"
            exit 1
          fi


          # ------------------------------------------------------
          # SET REQUIRED SYMBOLS
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "SET NETFILTER CONFIG"
          echo "=========================================="

          ./scripts/config --enable NF_TABLES

          ./scripts/config --module NF_TABLES_COMPAT

          ./scripts/config --module NETFILTER_XTABLES


          # ------------------------------------------------------
          # OLDDEFCONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make olddefconfig


          # ------------------------------------------------------
          # FINAL CONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "FINAL KERNEL NETFILTER CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
            .config || true


          # ------------------------------------------------------
          # VERIFY TARGET
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "VERIFY NFT_COMPAT CONFIG"
          echo "=========================================="

          if ! grep -q '^CONFIG_NF_TABLES_COMPAT=m$' .config; then

            echo
            echo "CONFIG_NF_TABLES_COMPAT=m was NOT produced."
            echo
            echo "Actual relevant configuration:"
            grep -E \
              '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
              .config || true

            echo
            echo "Kconfig definition:"
            grep -R \
              -n \
              -A12 \
              -B3 \
              'config NF_TABLES_COMPAT' \
              net \
              2>/dev/null | head -80 || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "NFT_COMPAT CONFIGURATION OK"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
            .config || true


      # ==========================================================
      # BUILD LINUX
      # ==========================================================

      - name: Build Linux kernel modules
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          make target/linux/compile -j2 V=s


      # ==========================================================
      # FIND NFT_COMPAT
      # ==========================================================

      - name: Verify nft_compat module
        run: |
          set -e

          cd wrt

          echo
          echo "=========================================="
          echo "SEARCH nft_compat.ko"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print

          NFT_KO="$(find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            -quit)"

          if [ -z "$NFT_KO" ]; then
            echo
            echo "ERROR: nft_compat.ko NOT FOUND"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "NFT COMPAT FOUND"
          echo "=========================================="

          echo "PATH:"
          echo "$NFT_KO"

          echo
          echo "FILE:"
          file "$NFT_KO"

          echo
          echo "MODINFO:"
          modinfo "$NFT_KO" 2>/dev/null || true

          echo
          echo "VERMAGIC:"
          modinfo -F vermagic "$NFT_KO" 2>/dev/null || true


      # ==========================================================
      # COLLECT
      # ==========================================================

      - name: Collect result
        run: |
          set -e

          rm -rf result
          mkdir -p result

          NFT_KO="$(find wrt/build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            -quit)"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko not found"
            exit 1
          fi

          cp -v "$NFT_KO" result/nft_compat.ko

          echo
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          ls -lh result/nft_compat.ko

          file result/nft_compat.ko

          test -s result/nft_compat.ko


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-6.12.106
          path: result/nft_compat.ko
          if-no-files-found: error