name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout CI
        uses: actions/checkout@v4

      # ==========================================================
      # 清理 Runner 空间
      # ==========================================================
      - name: Free disk space
        run: |
          echo "=== DISK BEFORE ==="
          df -h /

          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true

          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean

          echo
          echo "=== DISK AFTER ==="
          df -h /

      # ==========================================================
      # 编译环境
      # ==========================================================
      - name: Init build environment
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libpython3-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            git \
            python3 \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            pkgconf \
            patch \
            perl \
            tar \
            xz-utils \
            bc \
            ccache

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "=== BUILD ENV READY ==="
          df -h /

      # ==========================================================
      # 拉取与你当前固件完全对应的源码
      # ==========================================================
      - name: Clone exact ImmortalWrt source
        run: |
          git clone \
            https://github.com/VIKINGYFY/immortalwrt.git \
            wrt

          cd wrt

          git checkout 3c810bd

          echo "=========================================="
          echo "SOURCE COMMIT"
          echo "=========================================="

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "Expected:"
          echo "3c810bd kernel: bump 6.12 to 6.12.106"

      # ==========================================================
      # 配置目标
      # ==========================================================
      - name: Configure target
        run: |
          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y

          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          echo "=========================================="
          echo "UPDATE FEEDS"
          echo "=========================================="

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo
          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          grep '^CONFIG_TARGET_' .config | \
            grep -E 'qualcommax|ipq60xx|jdcloud' || true

          echo
          echo "=========================================="
          echo "KERNEL"
          echo "=========================================="

          grep '^CONFIG_LINUX_' .config || true

          echo
          echo "=========================================="
          echo "NFT"
          echo "=========================================="

          grep -E \
            'NFT_COMPAT|NF_TABLES_COMPAT|NETFILTER_XTABLES|NF_TABLES' \
            .config || true

      # ==========================================================
      # 先编译 HOST TOOLS
      # 解决 flex / m4 问题
      # ==========================================================
      - name: Build host tools
        run: |
          cd wrt

          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="

          make tools/install V=s -j2

          echo
          echo "Checking host tools..."

          test -x staging_dir/host/bin/m4
          test -x staging_dir/host/bin/flex

          echo "m4:"
          staging_dir/host/bin/m4 --version | head -1

          echo "flex:"
          staging_dir/host/bin/flex --version | head -1

      # ==========================================================
      # 编译完整 OpenWrt 工具链
      # 解决 aarch64-openwrt-linux-musl-gcc 不存在
      # ==========================================================
      - name: Build toolchain
        run: |
          cd wrt

          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="

          make toolchain/install V=s -j2

          echo
          echo "Checking cross compiler..."

          test -x staging_dir/toolchain-aarch64_cortex-a53_gcc-*/bin/aarch64-openwrt-linux-musl-gcc

          find staging_dir \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -print

      # ==========================================================
      # 准备内核
      # ==========================================================
      - name: Prepare Linux 6.12.106
        run: |
          cd wrt

          echo "=========================================="
          echo "PREPARE KERNEL"
          echo "=========================================="

          make target/linux/prepare V=s

          echo
          echo "Kernel source:"
          find build_dir/target-* \
            -maxdepth 3 \
            -type d \
            -name 'linux-6.12.*' \
            -print

      # ==========================================================
      # 编译 Linux 6.12.106
      # ==========================================================
      - name: Build Linux 6.12.106
        run: |
          cd wrt

          echo "=========================================="
          echo "BUILD LINUX 6.12.106"
          echo "=========================================="

          df -h /
          df -ih /

          make target/linux/compile V=s -j2

          echo
          echo "=========================================="
          echo "KERNEL BUILD COMPLETE"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print 2>/dev/null || true

      # ==========================================================
      # 专门构建 kmod-nft-compat
      # ==========================================================
      - name: Build nft-compat package
        run: |
          cd wrt

          echo "=========================================="
          echo "BUILD KMOD-NFT-COMPAT"
          echo "=========================================="

          make package/kernel/linux/compile V=s -j2

      # ==========================================================
      # 查找结果
      # ==========================================================
      - name: Verify nft compat
        run: |
          cd wrt

          echo "=========================================="
          echo "SEARCH APK"
          echo "=========================================="

          find bin packages \
            -type f \
            \( \
              -iname '*nft*compat*.apk' \
              -o \
              -iname '*nft*compat*.ipk' \
            \) \
            -print 2>/dev/null || true

          echo
          echo "=========================================="
          echo "SEARCH KO"
          echo "=========================================="

          find . \
            -type f \
            -name 'nft_compat.ko' \
            -print 2>/dev/null || true

      # ==========================================================
      # 收集文件
      # ==========================================================
      - name: Collect result
        run: |
          rm -rf result
          mkdir -p result

          echo "=== APK ==="

          find wrt/bin wrt/packages wrt \
            -type f \
            \( \
              -iname '*nft*compat*.apk' \
              -o \
              -iname '*nft*compat*.ipk' \
            \) \
            -exec cp -v {} result/ \; \
            2>/dev/null || true

          echo
          echo "=== KO ==="

          find wrt \
            -type f \
            -name 'nft_compat.ko' \
            -exec cp -v {} result/ \; \
            2>/dev/null || true

          echo
          echo "=== BUILD INFO ==="

          echo "3c810bd" > result/SOURCE_COMMIT.txt

          echo "6.12.106" > result/KERNEL_VERSION.txt

          echo "qualcommax/ipq60xx/jdcloud_re-cs-02" \
            > result/TARGET.txt

          echo
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          ls -lah result

          echo
          echo "Checking required files..."

          if ! find result \
            -type f \
            \( \
              -iname '*nft*compat*.apk' \
              -o \
              -name 'nft_compat.ko' \
            \) | grep -q .; then

            echo "ERROR: nft-compat was NOT produced."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

      # ==========================================================
      # 上传 Artifact
      # ==========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-ipq60xx-kernel-6.12.106
          path: result/
          if-no-files-found: error
          retention-days: 30