name: Build iptables-nft Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # FREE DISK SPACE
      # ==========================================
      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

          df -h

      # ==========================================
      # BUILD DEPENDENCIES
      # ==========================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils \
            bc \
            kmod

      # ==========================================
      # CLONE EXACT IMMORTALWRT
      # ==========================================
      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline

      # ==========================================
      # OPENWRT TARGET CONFIG
      # ==========================================
      - name: Configure OpenWrt target
        run: |
          set -e

          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y

          CONFIG_PACKAGE_kmod-ipt-core=m
          CONFIG_PACKAGE_kmod-nft-compat=m

          CONFIG_PACKAGE_iptables-nft=y
          EOF

          echo "=========================================="
          echo "OPENWRT DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "PACKAGE CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-ipt-core|kmod-nft-compat|iptables-nft)=' \
            .config || true

          echo
          echo "=========================================="
          echo "KERNEL CONFIG REQUEST"
          echo "=========================================="

          cat >> .config <<'EOF'

          # ==========================================
          # NETFILTER / IPTABLES COMPAT
          # ==========================================

          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NETFILTER_XTABLES=y

          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=m

          CONFIG_NF_TABLES=y
          CONFIG_NFT_COMPAT=m

          CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
          CONFIG_NETFILTER_XT_TARGET_MARK=m
          CONFIG_NETFILTER_XT_TARGET_NFLOG=m
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=m

          CONFIG_NETFILTER_XT_MATCH_COMMENT=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_NETFILTER_XT_MATCH_MARK=m
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
          CONFIG_NETFILTER_XT_MATCH_SOCKET=m
          CONFIG_NETFILTER_XT_MATCH_STATE=m

          CONFIG_IP_NF_IPTABLES=m
          CONFIG_IP_NF_FILTER=m
          CONFIG_IP_NF_NAT=m
          CONFIG_IP_NF_TARGET_MASQUERADE=m
          CONFIG_IP_NF_TARGET_REDIRECT=m

          CONFIG_IP6_NF_IPTABLES=m
          CONFIG_IP6_NF_FILTER=m
          CONFIG_IP6_NF_NAT=m
          EOF

          make defconfig

          echo
          echo "=========================================="
          echo "FINAL PACKAGE CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-ipt-core|kmod-nft-compat|iptables-nft)=' \
            .config || true

          echo
          echo "=========================================="
          echo "FINAL REQUESTED KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NETFILTER_NETLINK|NETFILTER_XTABLES|NF_CONNTRACK|NF_NAT|NF_TABLES|NFT_COMPAT|IP_NF|IP6_NF)=' \
            .config || true

      # ==========================================
      # VERIFY CONFIG RESOLUTION
      # ==========================================
      - name: Verify configuration resolution
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "CONFIG RESOLUTION"
          echo "=========================================="

          make defconfig

          echo
          echo "PACKAGE:"
          grep -E \
            '^CONFIG_PACKAGE_(kmod-ipt-core|kmod-nft-compat|iptables-nft)=' \
            .config || true

          echo
          echo "NETFILTER:"
          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NETFILTER_NETLINK|NETFILTER_XTABLES|NF_CONNTRACK|NF_NAT|NF_TABLES|NFT_COMPAT|IP_NF|IP6_NF)=' \
            .config || true

      # ==========================================
      # BUILD HOST TOOLS
      # ==========================================
      - name: Build host tools
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="

          make tools/install -j$(nproc)

      # ==========================================
      # BUILD TOOLCHAIN
      # ==========================================
      - name: Build toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="

          make toolchain/install -j$(nproc)

      # ==========================================
      # PREPARE LINUX 6.12.106
      # ==========================================
      - name: Prepare Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "PREPARE LINUX"
          echo "=========================================="

          make target/linux/prepare V=s

          KDIR="$(find build_dir/target-* \
            -maxdepth 5 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: Linux 6.12.106 source directory not found"

            find build_dir/target-* \
              -maxdepth 5 \
              -type d \
              -name 'linux-*' \
              -print || true

            exit 1
          fi

          echo "$KDIR" > /tmp/kdir

          echo
          echo "KERNEL DIRECTORY:"
          echo "$KDIR"

          VERSION="$(make -C "$KDIR" kernelversion | tr -d '\r\n')"

          echo
          echo "KERNEL VERSION:"
          echo "$VERSION"

          if [ "$VERSION" != "6.12.106" ]; then
            echo "ERROR: Expected 6.12.106, got $VERSION"
            exit 1
          fi

      # ==========================================
      # FORCE KERNEL CONFIG
      # ==========================================
      - name: Apply kernel Netfilter configuration
        run: |
          set -e

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "APPLY KERNEL CONFIG"
          echo "=========================================="

          cd "$KDIR"

          echo "Before kernel config:"
          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NETFILTER_NETLINK|NETFILTER_XTABLES|NF_CONNTRACK|NF_NAT|NF_TABLES|NFT_COMPAT|IP_NF|IP6_NF)=' \
            .config || true

          ./scripts/config --enable NETFILTER
          ./scripts/config --enable NETFILTER_ADVANCED
          ./scripts/config --enable NETFILTER_NETLINK
          ./scripts/config --enable NETFILTER_XTABLES

          ./scripts/config --enable NF_CONNTRACK
          ./scripts/config --module NF_NAT

          ./scripts/config --enable NF_TABLES
          ./scripts/config --module NFT_COMPAT

          ./scripts/config --module NETFILTER_XT_TARGET_REDIRECT
          ./scripts/config --module NETFILTER_XT_TARGET_MASQUERADE
          ./scripts/config --module NETFILTER_XT_TARGET_MARK
          ./scripts/config --module NETFILTER_XT_TARGET_NFLOG
          ./scripts/config --module NETFILTER_XT_TARGET_TCPMSS

          ./scripts/config --module NETFILTER_XT_MATCH_COMMENT
          ./scripts/config --module NETFILTER_XT_MATCH_CONNTRACK
          ./scripts/config --module NETFILTER_XT_MATCH_MARK
          ./scripts/config --module NETFILTER_XT_MATCH_MULTIPORT
          ./scripts/config --module NETFILTER_XT_MATCH_SOCKET
          ./scripts/config --module NETFILTER_XT_MATCH_STATE

          ./scripts/config --module IP_NF_IPTABLES
          ./scripts/config --module IP_NF_FILTER
          ./scripts/config --module IP_NF_NAT
          ./scripts/config --module IP_NF_TARGET_MASQUERADE
          ./scripts/config --module IP_NF_TARGET_REDIRECT

          ./scripts/config --module IP6_NF_IPTABLES
          ./scripts/config --module IP6_NF_FILTER
          ./scripts/config --module IP6_NF_NAT

          make olddefconfig

          echo
          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NETFILTER_NETLINK|NETFILTER_XTABLES|NF_CONNTRACK|NF_NAT|NF_TABLES|NFT_COMPAT|IP_NF|IP6_NF)=' \
            .config || true

      # ==========================================
      # BUILD KERNEL
      # ==========================================
      - name: Build Linux kernel modules
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD LINUX"
          echo "=========================================="

          make target/linux/compile -j$(nproc)

      # ==========================================
      # VERIFY KERNEL CONFIG
      # ==========================================
      - name: Verify final kernel configuration
        run: |
          set -e

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "VERIFY FINAL KERNEL CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NETFILTER_NETLINK|NETFILTER_XTABLES|NF_CONNTRACK|NF_NAT|NF_TABLES|NFT_COMPAT|IP_NF|IP6_NF)=' \
            "$KDIR/.config" || true

          echo
          echo "=========================================="
          echo "CHECK REQUIRED CONFIG"
          echo "=========================================="

          for CONFIG in \
            CONFIG_NETFILTER \
            CONFIG_NETFILTER_XTABLES \
            CONFIG_NF_TABLES \
            CONFIG_NFT_COMPAT \
            CONFIG_IP_NF_IPTABLES \
            CONFIG_IP_NF_FILTER \
            CONFIG_IP_NF_NAT
          do
            VALUE="$(sed -n "s/^${CONFIG}=//p" "$KDIR/.config")"

            echo "$CONFIG=$VALUE"

            if [ "$VALUE" != "y" ] && [ "$VALUE" != "m" ]; then
              echo "ERROR: $CONFIG is not enabled"
              exit 1
            fi
          done

          echo
          echo "SUCCESS: required Netfilter/iptables configuration exists"

      # ==========================================
      # FIND REQUIRED MODULES
      # ==========================================
      - name: Find required kernel modules
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "SEARCH REQUIRED MODULES"
          echo "=========================================="

          find build_dir \
            -type f \
            \( \
              -name 'nft_compat.ko' \
              -o -name 'x_tables.ko' \
              -o -name 'ip_tables.ko' \
              -o -name 'iptable_filter.ko' \
              -o -name 'iptable_nat.ko' \
              -o -name 'xt_REDIRECT.ko' \
              -o -name 'xt_MASQUERADE.ko' \
              -o -name 'xt_comment.ko' \
              -o -name 'xt_conntrack.ko' \
              -o -name 'xt_mark.ko' \
              -o -name 'xt_multiport.ko' \
              -o -name 'xt_socket.ko' \
            \) \
            -print | sort

      # ==========================================
      # VERIFY NFT COMPAT
      # ==========================================
      - name: Verify nft compat module
        run: |
          set -e

          cd wrt

          NFT_KO="$(find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print -quit)"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko was NOT generated"

            echo
            echo "ALL NETFILTER MODULES:"
            find build_dir \
              -type f \
              \( -name '*nft*.ko' -o -name '*xt*.ko' -o -name '*table*.ko' \) \
              -print | sort || true

            exit 1
          fi

          echo "NFT COMPAT:"
          echo "$NFT_KO"

          echo
          echo "FILE:"
          file "$NFT_KO"

          echo
          echo "MODINFO:"
          modinfo "$NFT_KO" || true

          echo
          echo "VERMAGIC:"
          modinfo -F vermagic "$NFT_KO" || true

          VERMAGIC="$(modinfo -F vermagic "$NFT_KO" || true)"

          case "$VERMAGIC" in
            6.12.106*)
              echo
              echo "SUCCESS: nft_compat vermagic matches 6.12.106"
              ;;
            *)
              echo
              echo "ERROR: nft_compat vermagic mismatch"
              exit 1
              ;;
          esac

      # ==========================================
      # BUILD PACKAGE INDEX / PACKAGE TARGET
      # ==========================================
      - name: Build required packages
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD REQUIRED PACKAGES"
          echo "=========================================="

          make package/kernel/linux/compile -j$(nproc)

          echo
          echo "=========================================="
          echo "SEARCH APK / IPK PACKAGES"
          echo "=========================================="

          find bin \
            -type f \
            \( \
              -name '*kmod-ipt-core*' \
              -o -name '*kmod-nft-compat*' \
              -o -name '*iptables-nft*' \
            \) \
            -print | sort || true

      # ==========================================
      # COLLECT ALL REQUIRED FILES
      # ==========================================
      - name: Collect result
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "COLLECT RESULT"
          echo "=========================================="

          mkdir -p result

          find build_dir \
            -type f \
            \( \
              -name 'nft_compat.ko' \
              -o -name 'x_tables.ko' \
              -o -name 'ip_tables.ko' \
              -o -name 'iptable_filter.ko' \
              -o -name 'iptable_nat.ko' \
              -o -name 'xt_REDIRECT.ko' \
              -o -name 'xt_MASQUERADE.ko' \
              -o -name 'xt_comment.ko' \
              -o -name 'xt_conntrack.ko' \
              -o -name 'xt_mark.ko' \
              -o -name 'xt_multiport.ko' \
              -o -name 'xt_socket.ko' \
            \) \
            -exec cp {} result/ \;

          find bin \
            -type f \
            \( \
              -name '*kmod-ipt-core*.apk' \
              -o -name '*kmod-nft-compat*.apk' \
              -o -name '*iptables-nft*.apk' \
            \) \
            -exec cp {} result/ \; || true

          echo
          echo "=========================================="
          echo "RESULT FILES"
          echo "=========================================="

          find result -type f -maxdepth 1 -print -exec ls -lh {} \;

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          find result -type f -maxdepth 1 -exec sha256sum {} \;

          echo
          echo "=========================================="
          echo "CHECK"
          echo "=========================================="

          if ! find result -type f -name 'nft_compat.ko' | grep -q .; then
            echo "ERROR: nft_compat.ko missing"
            exit 1
          fi

          echo "SUCCESS: nft_compat.ko collected"

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptables-nft-compat-6.12.106
          path: wrt/result/*
          if-no-files-found: error