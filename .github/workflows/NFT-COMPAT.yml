name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # FREE DISK SPACE
      # ==========================================
      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          df -h

      # ==========================================
      # BUILD DEPENDENCIES
      # ==========================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils \
            bc \
            kmod

      # ==========================================
      # CLONE EXACT IMMORTALWRT
      # ==========================================
      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline

      # ==========================================
      # OPENWRT TARGET CONFIG
      # ==========================================
      - name: Configure OpenWrt target
        run: |
          set -e

          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          echo "=========================================="
          echo "OPENWRT DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "TARGET CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_TARGET_qualcommax|CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02|CONFIG_PACKAGE_kmod-nft-compat' \
            .config || true

      # ==========================================
      # HOST TOOLS
      # ==========================================
      - name: Build host tools
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="

          make tools/install -j2 V=s

      # ==========================================
      # TOOLCHAIN
      # ==========================================
      - name: Build toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="

          make toolchain/install -j2 V=s

          echo
          echo "=========================================="
          echo "CHECK INSTALLED TOOLCHAIN"
          echo "=========================================="

          TOOLCHAIN_DIR="$(find staging_dir \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -name 'toolchain-*' \
            -print -quit)"

          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: installed toolchain was not created"

            echo
            echo "STAGING DIR:"
            find staging_dir \
              -maxdepth 2 \
              -type d \
              -print | sort || true

            echo
            echo "TOOLCHAIN BUILD DIR:"
            find build_dir \
              -maxdepth 2 \
              -type d \
              -name 'toolchain-*' \
              -print || true

            exit 1
          fi

          echo "TOOLCHAIN:"
          echo "$TOOLCHAIN_DIR"

          echo
          echo "TOOLCHAIN BIN:"
          ls -lah "$TOOLCHAIN_DIR/bin" | head -100

          GCC="$(find "$TOOLCHAIN_DIR/bin" \
            -maxdepth 1 \
            -type f \
            -o \
            -type l \
            | grep '/aarch64-openwrt-linux-musl-gcc$' \
            | head -1 || true)"

          if [ -z "$GCC" ]; then
            echo "ERROR: aarch64-openwrt-linux-musl-gcc not found"

            echo
            echo "POSSIBLE AARCH64 GCC:"
            find "$TOOLCHAIN_DIR/bin" \
              -maxdepth 1 \
              \( \
                -name 'aarch64-openwrt-linux-musl-gcc*' \
                -o \
                -name '*openwrt*linux*musl*gcc*' \
              \) \
              -ls || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "GCC FOUND"
          echo "=========================================="

          echo "$GCC"
          "$GCC" --version

      # ==========================================
      # PREPARE LINUX 6.12.106
      # ==========================================
      - name: Prepare Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "PREPARE LINUX 6.12.106"
          echo "=========================================="

          make target/linux/prepare V=s

          KDIR="$(find build_dir/target-* \
            -maxdepth 5 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: Linux 6.12.106 source directory not found"

            find build_dir/target-* \
              -maxdepth 5 \
              -type d \
              -name 'linux-*' \
              -print || true

            exit 1
          fi

          echo "$KDIR" > /tmp/kdir

          echo
          echo "=========================================="
          echo "KERNEL DIRECTORY"
          echo "=========================================="

          echo "$KDIR"

          echo
          echo "KERNEL VERSION:"
          make -C "$KDIR" kernelversion

      # ==========================================
      # GENERATE + CONFIGURE KERNEL
      # ==========================================
      - name: Generate and configure Linux kernel config
        run: |
          set -e

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "GENERATE OPENWRT KERNEL CONFIG"
          echo "=========================================="

          echo "KDIR=$KDIR"

          make kernel_oldconfig CONFIG_TARGET=subtarget V=s

          echo
          echo "=========================================="
          echo "CHECK KERNEL CONFIG"
          echo "=========================================="

          if [ ! -s "$KDIR/.config" ]; then
            echo "ERROR: kernel .config was not generated"

            find "$KDIR" \
              -maxdepth 2 \
              -name '.config*' \
              -ls || true

            exit 1
          fi

          ls -lh "$KDIR/.config"

          cd "$KDIR"

          echo
          echo "=========================================="
          echo "CONFIGURE NFT_COMPAT"
          echo "=========================================="

          ./scripts/config --enable NF_TABLES
          ./scripts/config --module NETFILTER_XTABLES
          ./scripts/config --module NFT_COMPAT

          make olddefconfig

          echo
          echo "=========================================="
          echo "KERNEL NETFILTER CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NF_TABLES|NETFILTER_XTABLES|NFT_COMPAT)=' \
            .config || true

          echo
          echo "=========================================="
          echo "HARD VERIFY"
          echo "=========================================="

          grep -q '^CONFIG_NFT_COMPAT=m$' .config
          grep -q '^CONFIG_NETFILTER_XTABLES=m$'

          echo
          echo "SUCCESS:"
          echo "CONFIG_NFT_COMPAT=m"
          echo "CONFIG_NETFILTER_XTABLES=m"

      # ==========================================
      # BUILD LINUX
      # ==========================================
      - name: Build Linux kernel modules
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD LINUX KERNEL MODULES"
          echo "=========================================="

          make target/linux/compile -j2 V=s

      # ==========================================
      # FIND NFT_COMPAT
      # ==========================================
      - name: Verify nft_compat module
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "SEARCH NFT_COMPAT.KO"
          echo "=========================================="

          NFT_KO="$(find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print -quit)"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko was not generated"

            echo
            echo "SEARCH ALL NETFILTER MODULES:"

            find build_dir \
              -type f \
              \( \
                -name '*nft*.ko' \
                -o \
                -name '*xtables*.ko' \
              \) \
              -print | sort || true

            echo
            echo "KERNEL CONFIG:"

            grep -E \
              '^CONFIG_(NF_TABLES|NETFILTER_XTABLES|NFT_COMPAT)=' \
              "$(cat /tmp/kdir)/.config" || true

            exit 1
          fi

          echo "NFT_COMPAT:"
          echo "$NFT_KO"

          echo
          echo "=========================================="
          echo "MODINFO"
          echo "=========================================="

          modinfo "$NFT_KO" || true

          echo
          echo "=========================================="
          echo "VERMAGIC"
          echo "=========================================="

          VERMAGIC="$(modinfo -F vermagic "$NFT_KO" || true)"

          echo "$VERMAGIC"

          case "$VERMAGIC" in
            6.12.106*)
              echo
              echo "SUCCESS: vermagic matches Linux 6.12.106"
              ;;
            *)
              echo
              echo "ERROR: vermagic does NOT match Linux 6.12.106"
              exit 1
              ;;
          esac

          echo "$NFT_KO" > /tmp/nft_ko

      # ==========================================
      # COLLECT RESULT
      # ==========================================
      - name: Collect result
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "COLLECT NFT_COMPAT.KO"
          echo "=========================================="

          NFT_KO="$(cat /tmp/nft_ko)"

          mkdir -p result

          cp "$NFT_KO" result/nft_compat.ko

          echo
          echo "RESULT:"
          ls -lh result/nft_compat.ko

          echo
          echo "SHA256:"
          sha256sum result/nft_compat.ko

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-6.12.106
          path: wrt/result/nft_compat.ko
          if-no-files-found: error