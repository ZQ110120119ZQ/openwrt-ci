name: Build NFT Compat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Free GitHub Runner disk space
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h /

          echo
          echo "=== CLEANING LARGE PREINSTALLED SDKs ==="

          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true

          sudo docker system prune -af 2>/dev/null || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "=== AFTER CLEANUP ==="
          df -h /

      # ============================================================
      # 3. Build environment
      # ============================================================
      - name: Init build environment
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libpython3-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            git \
            python3 \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            pkgconf \
            patch \
            perl \
            tar \
            xz-utils \
            bc

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "=== DISK AFTER TOOLCHAIN ==="
          df -h /

      # ============================================================
      # 4. Clone ImmortalWrt
      # ============================================================
      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 \
            https://github.com/VIKINGYFY/immortalwrt.git \
            wrt

          cd wrt

          echo "========================================"
          echo " IMMORTALWRT SOURCE"
          echo "========================================"

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== DISK ==="
          df -h /

      # ============================================================
      # 5. Configure exact target
      # ============================================================
      - name: Configure target
        run: |
          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

          echo
          echo "========================================"
          echo " TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config | \
            grep -E 'qualcommax|ipq60xx|jdcloud' || true

          echo
          echo "========================================"
          echo " KERNEL"
          echo "========================================"

          grep '^CONFIG_LINUX_' .config || true

          echo
          echo "========================================"
          echo " NFT COMPAT"
          echo "========================================"

          grep -E \
            'NFT_COMPAT|NETFILTER_XTABLES|NF_TABLES|IP_NF_IPTABLES' \
            .config || true

          echo
          echo "=== DISK ==="
          df -h /

      # ============================================================
      # 6. Prepare kernel
      # ============================================================
      - name: Prepare kernel
        run: |
          cd wrt

          make target/linux/prepare V=s

          echo
          echo "=== DISK AFTER PREPARE ==="
          df -h /

      # ============================================================
      # 7. Build kernel
      # ============================================================
      - name: Build kernel
        run: |
          cd wrt

          echo "========================================"
          echo " BUILD KERNEL / MODULES"
          echo "========================================"

          echo "Disk before compile:"
          df -h /

          echo
          echo "Inodes:"
          df -ih /

          make target/linux/compile V=s -j2

          echo
          echo "Disk after compile:"
          df -h /

      # ============================================================
      # 8. Build nft-compat package
      # ============================================================
      - name: Build nft-compat package
        run: |
          cd wrt

          echo "========================================"
          echo " BUILD NFT COMPAT PACKAGE"
          echo "========================================"

          make package/kernel/linux/compile V=s -j2

      # ============================================================
      # 9. Find output
      # ============================================================
      - name: Find result
        run: |
          cd wrt

          echo "========================================"
          echo " SEARCH APK"
          echo "========================================"

          find bin packages build_dir staging_dir \
            -type f \
            \( \
              -name '*nft-compat*.apk' \
              -o \
              -name '*nft-compat*.ipk' \
            \) \
            -print 2>/dev/null || true

          echo
          echo "========================================"
          echo " SEARCH KO"
          echo "========================================"

          find . \
            -type f \
            -name 'nft_compat.ko' \
            -print 2>/dev/null || true

      # ============================================================
      # 10. Collect
      # ============================================================
      - name: Collect result
        run: |
          rm -rf result
          mkdir -p result

          find wrt/bin wrt/packages wrt \
            -type f \
            \( \
              -name '*nft-compat*.apk' \
              -o \
              -name '*nft-compat*.ipk' \
            \) \
            -exec cp -v {} result/ \; \
            2>/dev/null || true

          find wrt \
            -type f \
            -name 'nft_compat.ko' \
            -exec cp -v {} result/ \; \
            2>/dev/null || true

          cd wrt

          git rev-parse HEAD > ../result/IMMORTALWRT_COMMIT.txt

          grep '^CONFIG_TARGET_' .config | \
            grep -E 'qualcommax|ipq60xx|jdcloud' \
            > ../result/TARGET.txt || true

          grep '^CONFIG_LINUX_' .config \
            > ../result/KERNEL_CONFIG.txt || true

          cd ..

          echo
          echo "========================================"
          echo " FINAL RESULT"
          echo "========================================"

          ls -lah result

          echo
          echo "=== REQUIRED OUTPUT CHECK ==="

          if ! find result \
            -type f \
            \( \
              -name '*nft-compat*.apk' \
              -o \
              -name '*nft-compat*.ipk' \
              -o \
              -name 'nft_compat.ko' \
            \) | grep -q .; then

            echo "ERROR: nft-compat output NOT FOUND"
            exit 1
          fi

          echo "SUCCESS: nft-compat output found."

      # ============================================================
      # 11. Upload
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-ipq60xx-jdcloud
          path: result/
          if-no-files-found: error
          retention-days: 30