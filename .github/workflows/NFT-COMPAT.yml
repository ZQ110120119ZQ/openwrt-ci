name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # FREE DISK SPACE
      # ==========================================
      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

          df -h

      # ==========================================
      # BUILD DEPENDENCIES
      # ==========================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils \
            bc \
            kmod

      # ==========================================
      # CLONE EXACT IMMORTALWRT
      # ==========================================
      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline

      # ==========================================
      # OPENWRT TARGET CONFIG
      # ==========================================
      - name: Configure OpenWrt target
        run: |
          set -e

          cd wrt

          cat > .config <<'EOF'
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
CONFIG_PACKAGE_kmod-nft-compat=m
EOF

          echo "=========================================="
          echo "OPENWRT DEFCONFIG"
          echo "=========================================="

          make defconfig

          # 强制恢复 kmod-nft-compat=m（defconfig 有时会因为依赖把它翻成 =y）
          sed -i 's/^CONFIG_PACKAGE_kmod-nft-compat=.*/CONFIG_PACKAGE_kmod-nft-compat=m/' .config
          make defconfig

          echo
          echo "=========================================="
          echo "TARGET CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_TARGET_qualcommax|CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02|CONFIG_PACKAGE_kmod-nft-compat' \
            .config || true

          echo
          echo "=========================================="
          echo "VERIFY PACKAGE SELECTION"
          echo "=========================================="

          grep -Eq '^CONFIG_PACKAGE_kmod-nft-compat=[my]$' .config

          echo "SUCCESS: kmod-nft-compat enabled"

      # ==========================================
      # HOST TOOLS
      # ==========================================
      - name: Build host tools
        run: |
          set -e
          cd wrt
          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="
          make tools/install -j$(nproc) V=s

      # ==========================================
      # TOOLCHAIN
      # ==========================================
      - name: Build toolchain
        run: |
          set -e
          cd wrt
          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="
          make toolchain/install -j$(nproc) V=s

      # ==========================================
      # VERIFY TOOLCHAIN
      # ==========================================
      - name: Verify toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "VERIFY INSTALLED TOOLCHAIN"
          echo "=========================================="

          TOOLCHAIN_DIR="$(find staging_dir \
            -maxdepth 2 \
            -type d \
            -name 'toolchain-*' \
            -print -quit)"

          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "ERROR: installed toolchain not found"
            find staging_dir -maxdepth 3 -type d -name 'toolchain-*' -print || true
            exit 1
          fi

          echo "TOOLCHAIN:"
          echo "$TOOLCHAIN_DIR"

          if [ ! -x "$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc" ]; then
            echo "ERROR: aarch64-openwrt-linux-musl-gcc not found"
            ls -lah "$TOOLCHAIN_DIR/bin" | head -100
            exit 1
          fi

          echo
          echo "GCC:"
          "$TOOLCHAIN_DIR/bin/aarch64-openwrt-linux-musl-gcc" --version

      # ==========================================
      # PREPARE LINUX
      # ==========================================
      - name: Prepare Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "PREPARE LINUX 6.12.106"
          echo "=========================================="

          make target/linux/prepare V=s

          KDIR="$(find build_dir/target-* \
            -maxdepth 5 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: Linux 6.12.106 source directory not found"
            find build_dir/target-* -maxdepth 5 -type d -name 'linux-*' -print || true
            exit 1
          fi

          echo "$KDIR" > /tmp/kdir

          echo
          echo "=========================================="
          echo "KERNEL DIRECTORY"
          echo "=========================================="
          echo "$KDIR"

          echo
          echo "KERNEL VERSION:"
          make -C "$KDIR" kernelversion

          test "$(make -C "$KDIR" kernelversion)" = "6.12.106"

      # ==========================================
      # BUILD KERNEL + NFTC_COMPAT KMOD
      #
      # 重要：
      # nft_compat.ko 属于 OpenWrt 的 kernel *package*
      # (package/kernel/linux/modules/netfilter.mk)。
      #
      # 因此必须分两步：
      #   1) make target/linux/compile   -> 内核本体
      #   2) make package/kernel/linux/compile
      #      -> 编译 kmod-nft-compat 等外部内核模块，
      #         并把 .ko 生成到内核源码树里
      #         net/netfilter/nft_compat.ko
      # ==========================================
      - name: Build Linux kernel
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          make target/linux/compile -j$(nproc) V=s

      - name: Build kernel packages (nft_compat kmod)
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD KERNEL PACKAGES"
          echo "=========================================="

          make package/kernel/linux/compile -j$(nproc) V=s

      # ==========================================
      # VERIFY FINAL KERNEL CONFIG
      # ==========================================
      - name: Verify final kernel configuration
        run: |
          set -e

          cd wrt

          KDIR="$(cat /tmp/kdir)"

          echo "=========================================="
          echo "FINAL KERNEL CONFIG"
          echo "=========================================="

          if [ ! -s "$KDIR/.config" ]; then
            echo "ERROR: final kernel .config not found"
            exit 1
          fi

          echo
          echo "NETFILTER CONFIG:"
          grep -E \
            '^CONFIG_(NETFILTER|NETFILTER_ADVANCED|NF_TABLES|NETFILTER_XTABLES|NFT_COMPAT)=' \
            "$KDIR/.config" || true

          echo
          echo "=========================================="
          echo "VERIFY NFT_COMPAT CONFIG"
          echo "=========================================="

          NFT_COMPAT_VALUE="$(sed -n 's/^CONFIG_NFT_COMPAT=//p' "$KDIR/.config")"
          XTABLES_VALUE="$(sed -n 's/^CONFIG_NETFILTER_XTABLES=//p' "$KDIR/.config")"
          NF_TABLES_VALUE="$(sed -n 's/^CONFIG_NF_TABLES=//p' "$KDIR/.config")"
          NETFILTER_VALUE="$(sed -n 's/^CONFIG_NETFILTER=//p' "$KDIR/.config")"

          echo "CONFIG_NETFILTER=${NETFILTER_VALUE:-NOT_SET}"
          echo "CONFIG_NF_TABLES=${NF_TABLES_VALUE:-NOT_SET}"
          echo "CONFIG_NETFILTER_XTABLES=${XTABLES_VALUE:-NOT_SET}"
          echo "CONFIG_NFT_COMPAT=${NFT_COMPAT_VALUE:-NOT_SET}"

          if [ "$NFT_COMPAT_VALUE" != "m" ] && [ "$NFT_COMPAT_VALUE" != "y" ]; then
            echo
            echo "ERROR: CONFIG_NFT_COMPAT is not m/y"
            echo
            echo "FULL NFT RELATED CONFIG:"
            grep -E 'NFT|NETFILTER_XTABLES|NF_TABLES' "$KDIR/.config" | head -200 || true
            exit 1
          fi

          if [ "$XTABLES_VALUE" != "m" ] && [ "$XTABLES_VALUE" != "y" ]; then
            echo
            echo "ERROR: CONFIG_NETFILTER_XTABLES is not m/y"
            exit 1
          fi

          if [ -z "$NF_TABLES_VALUE" ]; then
            echo
            echo "ERROR: CONFIG_NF_TABLES is missing"
            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "CONFIG_NFT_COMPAT=$NFT_COMPAT_VALUE"
          echo "CONFIG_NETFILTER_XTABLES=$XTABLES_VALUE"
          echo "CONFIG_NF_TABLES=$NF_TABLES_VALUE"

      # ==========================================
      # FIND NFT_COMPAT
      # ==========================================
      - name: Verify nft_compat module
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "SEARCH NFT_COMPAT.KO"
          echo "=========================================="

          NFT_KO="$(find build_dir -type f -name 'nft_compat.ko' -print -quit)"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko was not generated"
            echo
            echo "SEARCH ALL NFT MODULES:"
            find build_dir -type f \( -name '*nft*.ko' -o -name '*xtables*.ko' \) -print | sort || true
            exit 1
          fi

          echo
          echo "NFT_COMPAT:"
          echo "$NFT_KO"

          echo
          echo "=========================================="
          echo "FILE"
          echo "=========================================="
          file "$NFT_KO"

          echo
          echo "=========================================="
          echo "MODINFO"
          echo "=========================================="
          modinfo "$NFT_KO" || true

          echo
          echo "=========================================="
          echo "VERMAGIC"
          echo "=========================================="

          VERMAGIC="$(modinfo -F vermagic "$NFT_KO" || true)"
          echo "$VERMAGIC"

          case "$VERMAGIC" in
            6.12.106*)
              echo
              echo "SUCCESS: vermagic matches Linux 6.12.106"
              ;;
            *)
              echo
              echo "ERROR: vermagic does NOT match Linux 6.12.106"
              exit 1
              ;;
          esac

          echo "$NFT_KO" > /tmp/nft_ko

      # ==========================================
      # COLLECT RESULT
      # ==========================================
      - name: Collect result
        run: |
          set -e

          cd wrt

          NFT_KO="$(cat /tmp/nft_ko)"

          echo "=========================================="
          echo "COLLECT NFT_COMPAT.KO"
          echo "=========================================="

          mkdir -p result
          cp "$NFT_KO" result/nft_compat.ko

          echo
          echo "RESULT:"
          ls -lh result/nft_compat.ko

          echo
          echo "SHA256:"
          sha256sum result/nft_compat.ko

          echo
          echo "=========================================="
          echo "MODULE DEPENDENCIES"
          echo "=========================================="
          modinfo -F depends result/nft_compat.ko || true

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-6.12.106
          path: wrt/result/nft_compat.ko
          if-no-files-found: error