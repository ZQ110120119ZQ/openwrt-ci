name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # FREE DISK SPACE
      # ==========================================================

      - name: Free disk space
        run: |
          set -e

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          sudo apt-get clean

          echo "=========================================="
          echo "DISK SPACE"
          echo "=========================================="

          df -h


      # ==========================================================
      # BUILD DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils


      # ==========================================================
      # CLONE EXACT IMMORTALWRT
      # ==========================================================

      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "IMMORTALWRT COMMIT"
          echo "=========================================="

          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "CURRENT COMMIT:"
          git rev-parse HEAD

          echo
          echo "CURRENT VERSION:"
          git log -1 --oneline


      # ==========================================================
      # OPENWRT TARGET CONFIG
      # ==========================================================

      - name: Configure OpenWrt target
        run: |
          set -e

          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          echo "=========================================="
          echo "OPENWRT DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo "TARGET CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_TARGET_qualcommax|CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02|CONFIG_PACKAGE_kmod-nft-compat' \
            .config || true


      # ==========================================================
      # HOST TOOLS
      # ==========================================================

      - name: Build host tools
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD HOST TOOLS"
          echo "=========================================="

          make tools/install -j2 V=s


      # ==========================================================
      # TOOLCHAIN
      # ==========================================================

      - name: Build toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD TOOLCHAIN"
          echo "=========================================="

          make toolchain/install -j2 V=s


      # ==========================================================
      # VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify OpenWrt toolchain
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "LOCATE AARCH64 GCC"
          echo "=========================================="

          GCC="$(find staging_dir \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -perm -111 \
            -print \
            -quit)"

          if [ -z "$GCC" ]; then
            echo "ERROR: aarch64-openwrt-linux-musl-gcc not found"
            echo
            echo "Available gcc binaries:"
            find staging_dir \
              -type f \
              -name '*gcc' \
              -perm -111 \
              -print | head -50 || true
            exit 1
          fi

          GCC_DIR="$(dirname "$GCC")"

          echo "GCC=$GCC"
          echo "GCC_DIR=$GCC_DIR"

          echo
          echo "GCC VERSION:"
          "$GCC" --version | head -1

          echo
          echo "=========================================="
          echo "EXPORT TOOLCHAIN PATH"
          echo "=========================================="

          echo "$PWD/$GCC_DIR" >> "$GITHUB_PATH"

          echo
          echo "PATH WILL CONTAIN:"
          echo "$PWD/$GCC_DIR"


      # ==========================================================
      # PREPARE LINUX
      # ==========================================================

      - name: Prepare Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "PREPARE LINUX 6.12.106"
          echo "=========================================="

          make target/linux/prepare V=s


      # ==========================================================
      # CONFIGURE LINUX
      # ==========================================================

      - name: Configure Linux 6.12.106
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "LOCATE LINUX 6.12.106"
          echo "=========================================="

          KDIR="$(find build_dir/target-* \
            -maxdepth 4 \
            -type d \
            -name 'linux-6.12.106' \
            -print -quit)"

          if [ -z "$KDIR" ]; then
            echo "ERROR: linux-6.12.106 directory not found"
            exit 1
          fi

          echo "KDIR=$KDIR"

          cd "$KDIR"

          echo
          echo "=========================================="
          echo "CHECK TOOLCHAIN"
          echo "=========================================="

          command -v aarch64-openwrt-linux-musl-gcc

          aarch64-openwrt-linux-musl-gcc --version | head -1


          # ------------------------------------------------------
          # KERNEL CONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "CONFIGURE NETFILTER COMPAT"
          echo "=========================================="

          if [ ! -x scripts/config ]; then
            echo "ERROR: scripts/config not found"
            exit 1
          fi

          # nftables
          ./scripts/config --enable NF_TABLES

          # Xtables
          ./scripts/config --module NETFILTER_XTABLES

          # Xtables compatibility
          ./scripts/config --enable NETFILTER_XTABLES_COMPAT

          # nftables xtables compatibility
          ./scripts/config --module NF_TABLES_COMPAT


          # ------------------------------------------------------
          # OLDDEFCONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make olddefconfig


          # ------------------------------------------------------
          # FINAL CONFIG
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "FINAL KERNEL NETFILTER CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(NF_TABLES|NF_TABLES_COMPAT|NETFILTER_XTABLES|NETFILTER_XTABLES_COMPAT)=' \
            .config || true


          # ------------------------------------------------------
          # VERIFY
          # ------------------------------------------------------

          echo
          echo "=========================================="
          echo "VERIFY REQUIRED CONFIG"
          echo "=========================================="

          grep -q '^CONFIG_NF_TABLES=y$' .config

          grep -q '^CONFIG_NETFILTER_XTABLES=m$' .config

          grep -q '^CONFIG_NETFILTER_XTABLES_COMPAT=y$' .config

          grep -q '^CONFIG_NF_TABLES_COMPAT=m$' .config

          echo
          echo "=========================================="
          echo "KERNEL CONFIGURATION OK"
          echo "=========================================="


      # ==========================================================
      # BUILD LINUX
      # ==========================================================

      - name: Build Linux kernel modules
        run: |
          set -e

          cd wrt

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          make target/linux/compile -j2 V=s


      # ==========================================================
      # FIND NFT_COMPAT
      # ==========================================================

      - name: Verify nft_compat module
        run: |
          set -e

          cd wrt

          echo
          echo "=========================================="
          echo "SEARCH nft_compat.ko"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print

          NFT_KO="$(find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            -quit)"

          if [ -z "$NFT_KO" ]; then
            echo
            echo "ERROR: nft_compat.ko NOT FOUND"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "NFT COMPAT FOUND"
          echo "=========================================="

          echo "PATH:"
          echo "$NFT_KO"

          echo
          echo "FILE:"
          file "$NFT_KO"

          echo
          echo "MODINFO:"
          modinfo "$NFT_KO" 2>/dev/null || true

          echo
          echo "VERMAGIC:"
          modinfo -F vermagic "$NFT_KO" 2>/dev/null || true


      # ==========================================================
      # COLLECT
      # ==========================================================

      - name: Collect result
        run: |
          set -e

          rm -rf result
          mkdir -p result

          NFT_KO="$(find wrt/build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            -quit)"

          if [ -z "$NFT_KO" ]; then
            echo "ERROR: nft_compat.ko not found"
            exit 1
          fi

          cp -v "$NFT_KO" result/nft_compat.ko

          echo
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          ls -lh result/nft_compat.ko

          file result/nft_compat.ko

          test -s result/nft_compat.ko


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-6.12.106
          path: result/nft_compat.ko
          if-no-files-found: error