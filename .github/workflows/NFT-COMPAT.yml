name: Build NFT Compat 6.12.106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            curl \
            wget \
            unzip \
            rsync \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            libncurses-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            swig \
            time \
            ccache \
            xz-utils

      - name: Clone exact ImmortalWrt source
        run: |
          set -e

          git clone https://github.com/VIKINGYFY/immortalwrt.git wrt

          cd wrt

          FULL_SHA="$(curl -fsSL \
            https://api.github.com/repos/VIKINGYFY/immortalwrt/commits/3c810bd \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"

          echo "=========================================="
          echo "EXACT COMMIT"
          echo "=========================================="
          echo "$FULL_SHA"

          git fetch --no-tags origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"

          echo
          echo "=========================================="
          echo "SOURCE VERSION"
          echo "=========================================="

          git rev-parse HEAD
          git log -1 --oneline

      - name: Configure target
        run: |
          set -e
          cd wrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_kmod-nft-compat=m
          EOF

          make defconfig

          echo
          echo "=========================================="
          echo "NFT CONFIG"
          echo "=========================================="

          grep -E \
            'CONFIG_PACKAGE_kmod-nft-compat|CONFIG_KERNEL_NF_TABLES_COMPAT|CONFIG_NF_TABLES_COMPAT' \
            .config || true

      - name: Build host tools
        run: |
          set -e
          cd wrt
          make tools/install -j2 V=s

      - name: Build toolchain
        run: |
          set -e
          cd wrt
          make toolchain/install -j2 V=s

      - name: Prepare Linux 6.12.106
        run: |
          set -e
          cd wrt
          make target/linux/prepare V=s

      - name: Build Linux 6.12.106
        run: |
          set -e
          cd wrt

          make target/linux/compile V=s -j2

          echo
          echo "=========================================="
          echo "SEARCH nft_compat.ko"
          echo "=========================================="

          find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "CHECK KERNEL CONFIG"
          echo "=========================================="

          find build_dir \
            -type f \
            -name '.config' \
            -path '*linux-6.12.106*' \
            -exec grep -E \
            'CONFIG_NF_TABLES_COMPAT|CONFIG_NFT_COMPAT' {} \; \
            2>/dev/null || true

      - name: Build nft compat only
        run: |
          set -e
          cd wrt

          echo
          echo "=========================================="
          echo "LOCATE nft_compat.ko"
          echo "=========================================="

          NFT_KO="$(find build_dir \
            -type f \
            -name 'nft_compat.ko' \
            -print \
            -quit \
            2>/dev/null || true)"

          if [ -z "$NFT_KO" ]; then
            echo
            echo "ERROR: nft_compat.ko was not generated."
            echo
            echo "Kernel config:"
            find build_dir \
              -type f \
              -name '.config' \
              -path '*linux-6.12.106*' \
              -exec grep -E \
              'CONFIG_NF_TABLES_COMPAT|CONFIG_NFT_COMPAT' {} \; \
              2>/dev/null || true
            exit 1
          fi

          echo
          echo "FOUND:"
          echo "$NFT_KO"

          echo
          echo "FILE:"
          file "$NFT_KO"

          echo
          echo "MODINFO:"
          modinfo "$NFT_KO" 2>/dev/null || true

      - name: Collect result
        run: |
          set -e

          rm -rf result
          mkdir -p result

          echo "=========================================="
          echo "COLLECT nft_compat.ko"
          echo "=========================================="

          find wrt \
            -type f \
            -name 'nft_compat.ko' \
            -exec cp -v {} result/ \;

          echo
          echo "=========================================="
          echo "RESULT"
          echo "=========================================="

          ls -lah result

          if [ ! -f result/nft_compat.ko ]; then
            echo
            echo "ERROR: nft_compat.ko not found."
            exit 1
          fi

          echo
          echo "SUCCESS:"
          file result/nft_compat.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-compat-6.12.106
          path: result/
          if-no-files-found: error